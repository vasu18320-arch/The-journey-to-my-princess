<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050509">
  <title>The Journey to My Princess — An Anniversary Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="gameShell">
      <canvas id="game" width="420" height="560" aria-label="The Journey to My Princess game"></canvas>
      <div id="message" class="hidden">
        <div id="messageText"></div>
        <button id="continueBtn">CONTINUE</button>
      </div>
    </section>

    <section id="controls" aria-label="Game controls">
      <div class="controlRow">
        <button class="ctrl" id="leftBtn">◀<span>LEFT</span></button>
        <button class="ctrl" id="rightBtn">▶<span>RIGHT</span></button>
      </div>
      <div class="controlRow">
        <button class="ctrl action" id="jumpBtn">▲<span>JUMP</span></button>
        <button class="ctrl action" id="attackBtn">⚔<span>ACT</span></button>
      </div>
    </section>
  </main>

  <div id="rotateNotice">Please rotate your phone to portrait mode.</div>
  <script src="game.js"></script>
</body>
</html>
